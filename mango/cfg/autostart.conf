# | Auto Start |
# autostart your favorite applications here
#
# ligma
# Perihelion Bar desktop stack:

# Let portals (Open/Save dialogs, screen sharing) see this session.
exec_once=dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
# Perihelion Bar on top and its dock at the bottom (the dock only when it is
# on in Settings). Waits for the default audio output first, so the bar's
# cava hears it. Running perihelion-bar-start again restarts both.
exec_once=perihelion-bar-start
# App drawer daemon (quickshell). Started up front so the launcher bind is a
# plain IPC round trip instead of a cold start on first press.
exec_once = appdrawer start
# Notification daemon.
exec_once = swaync
# Restore the wallpaper (also re-runs matugen so the whole desktop starts themed).
exec_once = perihelionbar-restore-wallpaper
# Desktop widgets, window overview (Alt+W) and Glance (Super+I): Perihelion Shell.
exec_once=perihelion-shell
# Clipboard history store (Super+C reads it via cliphist + rofi).
exec_once = wl-paste --watch cliphist store
# Polkit authentication agent (GUI prompts for privileged actions).
exec_once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
# Lock after 10 idle minutes, and before suspend (perihelion-lock).
exec_once=swayidle -w timeout 600 perihelion-lock before-sleep perihelion-lock

exec_once = easyeffects --gapplication-service
