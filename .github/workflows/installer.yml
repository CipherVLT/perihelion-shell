# The installer: shellcheck and the unit tests on every push, then the real
# install.sh --yes in containers: Arch (MangoWM and Hyprland), CachyOS and
# Fedora 45 (MangoWM): fresh home, second run changes nothing, existing
# setups, a user created later, Perihelion Linux detected.
name: Installer

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          shellcheck --version | head -2
          shellcheck -x -s bash install.sh scripts/*.sh tests/installer/*.sh tests/session/*.sh
          for f in desktop/bin/*; do
            if head -1 "$f" | grep -qE '^#!.*\b(ba)?sh\b'; then shellcheck -S warning "$f"; fi
          done
      - name: Config handling (keep / take new / beside, backups, re-runs)
        run: bash tests/installer/configs-test.sh
      - name: MangoWM configs with answers typed at a real terminal (script)
        run: bash tests/installer/prompts-test.sh
      - name: Old images removed only when their checksum matches
        run: bash tests/installer/leftovers-test.sh
      - name: Login session seeds ~/.config/mango once; the session starter starts each piece once
        run: bash tests/session/session-test.sh
      - name: Title and steps per terminal (no emoji on TERM=linux, no colour in a pipe)
        run: bash tests/installer/banner-test.sh
      - name: A stale package database (404) is explained, refreshed and retried
        run: bash tests/installer/stale-db-test.sh

  install:
    needs: lint
    runs-on: ubuntu-latest
    container: ${{ matrix.image }}
    name: ${{ matrix.distro }} (${{ matrix.wm }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { distro: arch, image: "archlinux:latest", wm: mango }
          - { distro: arch, image: "archlinux:latest", wm: hyprland }
          - { distro: cachyos, image: "cachyos/cachyos-v3:latest", wm: mango }
          - { distro: fedora, image: "fedora:45", wm: mango }
    steps:
      - name: Tools for checkout
        run: |
          if command -v pacman >/dev/null; then pacman -Syu --noconfirm --needed git
          else dnf install -y git-core; fi
      - uses: actions/checkout@v4
      - name: install.sh --yes --wm=${{ matrix.wm }} on fresh and existing homes
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          bash tests/installer/e2e.sh "${{ matrix.wm }}"
      - name: The install log
        if: always()
        run: |
          for f in /home/*/.local/state/perihelionbar/install.log; do
            echo "::group::$f"; cat "$f"; echo "::endgroup::"
          done

  # hyprland.conf setups (Hyprland before 0.57): check perihelion.conf with a
  # Hyprland that still reads it, 0.56.2 from the Arch Linux Archive.
  hyprland-conf:
    needs: lint
    runs-on: ubuntu-latest
    # The Arch image of the same week as the archive snapshot below, so only
    # Hyprland and its dependencies come from the (slow) archive.
    container: archlinux:base-20261011.0.609700
    steps:
      - name: Hyprland 0.56 from the Arch Linux Archive (2026-10-11)
        run: |
          echo 'Server = https://archive.archlinux.org/repos/2026/10/11/$repo/os/$arch' > /etc/pacman.d/mirrorlist
          sed -i 's/^#\?ParallelDownloads.*/ParallelDownloads = 1/' /etc/pacman.conf
          # The archive resets busy connections: one download at a time, no
          # timeout, five tries (finished files stay in the cache).
          for try in 1 2 3 4 5; do
            pacman -Syy --noconfirm --disable-download-timeout --needed hyprland git && break
            [ "$try" = 5 ] && exit 1
            sleep $((try * 20))
          done
          # Hyprland 0.56 refuses to start, even for --version, without it.
          export XDG_RUNTIME_DIR=$(mktemp -d)
          Hyprland --version | head -1
          Hyprland --version | head -1 | grep -q '^Hyprland 0\.56\.'
      - uses: actions/checkout@v4
      - name: Unprivileged user (Hyprland refuses to run as root; --version returns before that check)
        run: useradd -m hyprci
      - name: perihelion.conf through one source line passes Hyprland's config check
        run: |
          d=$(runuser -u hyprci -- mktemp -d)
          cp desktop/hypr/perihelion.conf "$d/"
          printf 'monitor=,preferred,auto,1\nbind = SUPER, Q, exec, foot\n\n# Perihelion Bar (delete this line to switch it off)\nsource = %s/perihelion.conf\n' "$d" > "$d/hyprland.conf"
          chown -R hyprci "$d"
          rt=$(runuser -u hyprci -- mktemp -d)
          out=$(runuser -u hyprci -- env XDG_RUNTIME_DIR="$rt" timeout 60 Hyprland --verify-config -c "$d/hyprland.conf" 2>&1 || true)
          if printf '%s\n' "$out" | grep -qx 'config ok'; then
            printf '%s\n' "$out" | sed -n '/parsing result/,$p'
          else
            printf '%s\n' "$out"; exit 1
          fi
      - name: The check catches a broken line (so "config ok" above means something)
        run: |
          d=$(runuser -u hyprci -- mktemp -d)
          printf 'bind = SUPER, Q, notadispatcher_xyz,\nnot_a_keyword_xyz = 1\n' > "$d/hyprland.conf"
          chown -R hyprci "$d"
          rt=$(runuser -u hyprci -- mktemp -d)
          out=$(runuser -u hyprci -- env XDG_RUNTIME_DIR="$rt" timeout 60 Hyprland --verify-config -c "$d/hyprland.conf" 2>&1 || true)
          printf '%s\n' "$out"
          # It must have parsed (not died early) and must not say ok.
          printf '%s\n' "$out" | grep -q 'parsing result'
          ! printf '%s\n' "$out" | grep -qx 'config ok'
