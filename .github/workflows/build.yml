# Compile check: builds the bar, Simpbar Config and simpbar-shell on Fedora
# with the same Zig release Perihelion's ISO uses, and checks the scripts.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:45
    env:
      ZIG_VERSION: 0.16.0
      ZIG_PUBKEY: RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
    steps:
      - name: Install build packages
        run: |
          dnf5 install -y --setopt=install_weak_deps=False \
            git-core curl xz minisign pkgconf-pkg-config tar \
            wayland-devel wayland-protocols-devel freetype-devel gdk-pixbuf2-devel libxkbcommon-devel \
            gtk4-devel libadwaita-devel glib2-devel \
            python3 python3-gobject gdk-pixbuf2 ShellCheck
          # matugen for the Material You style, from Terra like Perihelion's ISO
          dnf5 install -y --setopt=install_weak_deps=False \
            --repofrompath "terra,https://repos.fyralabs.com/terra45" --setopt=terra.gpgcheck=0 matugen
      - uses: actions/checkout@v4
      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: /opt/zig
          key: zig-${{ env.ZIG_VERSION }}
      - name: Install Zig
        run: |
          if [ ! -x /opt/zig/zig ]; then
            mkdir -p /opt/zig && cd /opt/zig
            url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
            curl -fsSL --retry 3 -o zig.tar.xz "$url"
            curl -fsSL --retry 3 -o zig.tar.xz.minisig "$url.minisig"
            minisign -V -P "$ZIG_PUBKEY" -m zig.tar.xz -x zig.tar.xz.minisig
            tar -xJf zig.tar.xz --strip-components=1 && rm zig.tar.xz*
          fi
          /opt/zig/zig version
      - name: Build the bar and Simpbar Config
        working-directory: simpbar
        run: /opt/zig/zig build -Doptimize=ReleaseFast -Dcpu=x86_64_v2
      - name: Build simpbar-shell
        working-directory: simpbar-shell
        run: /opt/zig/zig build -Doptimize=ReleaseFast -Dcpu=x86_64_v2
      - name: Test perihelion-theme
        run: |
          if [ -f perihelion-theme ]; then
            python3 -I theme/test-perihelion-theme.py
          fi
