# Compile check: builds the bar, Perihelion Bar Config and perihelionbar-shell on Fedora
# with the same Zig release Perihelion's ISO uses, and checks the scripts.
name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container: registry.fedoraproject.org/fedora:45
    env:
      ZIG_VERSION: 0.16.0
      ZIG_PUBKEY: RWSGOq2NVecA2UPNdBUZykf1CCb147pkmdtYxgb3Ti+JO/wCYvhbAb/U
    steps:
      - name: Install build packages
        run: |
          dnf5 install -y --setopt=install_weak_deps=False \
            git-core curl xz minisign pkgconf-pkg-config tar \
            wayland-devel wayland-protocols-devel freetype-devel gdk-pixbuf2-devel libxkbcommon-devel \
            gtk4-devel libadwaita-devel glib2-devel \
            python3 python3-gobject gdk-pixbuf2 ShellCheck
          # matugen for the Material You style, from Terra like Perihelion's ISO
          dnf5 install -y --setopt=install_weak_deps=False \
            --repofrompath "terra,https://repos.fyralabs.com/terra45" --setopt=terra.gpgcheck=0 matugen
      - uses: actions/checkout@v4
      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: /opt/zig
          key: zig-${{ env.ZIG_VERSION }}
      - name: Install Zig
        run: |
          if [ ! -x /opt/zig/zig ]; then
            mkdir -p /opt/zig && cd /opt/zig
            url="https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz"
            curl -fsSL --retry 3 -o zig.tar.xz "$url"
            curl -fsSL --retry 3 -o zig.tar.xz.minisig "$url.minisig"
            minisign -V -P "$ZIG_PUBKEY" -m zig.tar.xz -x zig.tar.xz.minisig
            tar -xJf zig.tar.xz --strip-components=1 && rm zig.tar.xz*
          fi
          /opt/zig/zig version
      - name: Build the bar and Perihelion Bar Config
        working-directory: perihelionbar
        run: /opt/zig/zig build -Doptimize=ReleaseFast -Dcpu=x86_64_v2
      - name: Unit-test the single-copy module
        working-directory: perihelionbar
        run: /opt/zig/zig test src/singleton.zig -lc
      - name: Unit-test the Network page's nmcli parser
        working-directory: perihelionbar
        run: /opt/zig/zig test src/network.zig -lc
      - name: Unit-test the icon theme lookup
        working-directory: perihelionbar
        run: /opt/zig/zig build test-icons
      - name: Unit-test the weather service (bar + desktop card)
        working-directory: perihelionbar
        run: /opt/zig/zig build test-weather
      - name: Unit-test the temperature service (fake sysfs tree)
        working-directory: perihelionbar
        run: /opt/zig/zig build test-temps
      - name: Unit-test the fastfetch service (fake system tree)
        working-directory: perihelionbar
        run: /opt/zig/zig build test-fastfetch
      - name: Unit-test the top-processes service (fake /proc tree)
        working-directory: perihelionbar
        run: /opt/zig/zig build test-procs
      - name: Unit-test the theme settings writers
        working-directory: perihelionbar
        run: /opt/zig/zig test src/desk_theme.zig -lc
      - name: Unit-test the Display page (outputs, rules, colour presets, EDID, ICC, night light)
        working-directory: perihelionbar
        run: |
          /opt/zig/zig test src/display.zig -lc
          # The generated ICC profiles must open in Little CMS, the library
          # wlroots (and so Mango) applies them with.
          python3 -c 'import PIL.ImageCms' 2>/dev/null || dnf5 install -y --setopt=install_weak_deps=False python3-pillow
          python3 ../tests/icc-check.py /tmp/perihelion-icc-test
      - name: "Live test: one bar and one dock under every toggle"
        run: |
          # The real bar and Settings against a headless compositor, flipping
          # the Bar and Dock switches in a loop (tests/singleton-live.sh).
          dnf5 install -y --setopt=install_weak_deps=False \
            sway procps-ng fontconfig dejavu-sans-mono-fonts util-linux gawk findutils
          useradd -m tester
          cp -r perihelionbar/zig-out/bin /tmp/perihelion-bin && chmod -R a+rX /tmp/perihelion-bin
          cp tests/singleton-live.sh /tmp/ && chmod a+rx /tmp/singleton-live.sh
          # Fedora's sway carries a file capability the container can't
          # grant (exec fails); a plain copy has none.
          cp /usr/bin/sway /tmp/sway && chmod a+rx /tmp/sway
          runuser -u tester -- env SWAY=/tmp/sway bash /tmp/singleton-live.sh /tmp/perihelion-bin
      - name: "Pictures: every Settings page and the dock, on a headless compositor"
        run: |
          dnf5 install -y --setopt=install_weak_deps=False \
            grim swaybg dbus-daemon ImageMagick adwaita-icon-theme adwaita-sans-fonts
          # Icon packs for the dock pictures; any Fedora no longer ships is skipped.
          dnf5 install -y --setopt=install_weak_deps=False --skip-unavailable \
            papirus-icon-theme numix-icon-theme numix-icon-theme-circle
          mkdir -p /tmp/shots-repo && cp -r tests perihelion-theme theme /tmp/shots-repo/ && chmod -R a+rX /tmp/shots-repo
          mkdir -p /tmp/shots && chown tester /tmp/shots
          runuser -u tester -- env SWAY=/tmp/sway dbus-run-session -- \
            bash /tmp/shots-repo/tests/screenshots.sh /tmp/perihelion-bin /tmp/shots
      - name: Print the pictures into the log (commit message has [pictures])
        # For reviewing them where the artifact can't be downloaded: small
        # JPEGs as base64, each line "@@IMG <file> <data>".
        if: contains(github.event.head_commit.message, '[pictures]')
        run: |
          cd /tmp/shots
          for f in *.png; do
            case "$f" in
              dock-*-3x.png) magick "$f" "/tmp/${f%.png}.jpg" ;;
              dock-*) continue ;;
              *) magick "$f" -resize 1100x -quality 55 "/tmp/${f%.png}.jpg" ;;
            esac
            base64 -w 3000 "/tmp/${f%.png}.jpg" | sed "s|^|@@IMG ${f%.png}.jpg |"
          done
      - name: Upload the pictures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: /tmp/shots
          if-no-files-found: warn
      - name: Build perihelionbar-shell
        working-directory: perihelionbar-shell
        run: /opt/zig/zig build -Doptimize=ReleaseFast -Dcpu=x86_64_v2
      - name: Unit-test the desktop cards (notes editing and pages, layout)
        working-directory: perihelionbar-shell
        run: /opt/zig/zig build test-widgets
      - name: Check the app drawer's QML parses
        run: |
          dnf5 install -y --setopt=install_weak_deps=False qt6-qtdeclarative-devel
          qmlformat=$(command -v qmlformat6 || command -v qmlformat || ls /usr/lib64/qt6/bin/qmlformat)
          # qmlformat parses each file fully and fails on any syntax error;
          # Quickshell's own types need no resolving for that.
          for f in quickshell/appdrawer/*.qml; do
            "$qmlformat" "$f" >/dev/null || { echo "QML syntax error in $f"; exit 1; }
          done
          echo "QML OK"
      - name: Test the app drawer's icon theme lookup
        run: |
          command -v node >/dev/null || dnf5 install -y --setopt=install_weak_deps=False nodejs
          tests/drawer-icons.sh
      - name: Test perihelion-theme
        run: |
          if [ -f perihelion-theme ]; then
            python3 -I theme/test-perihelion-theme.py
          fi
