# Perihelion Bar for Hyprland setups that still use hyprland.conf
# (Hyprland 0.55 and 0.56 read it; 0.57 reads only hyprland.lua, which gets
# perihelion.lua instead).
#
# The installer adds one line to your ~/.config/hypr/hyprland.conf:
#     source = ~/.config/hypr/perihelion.conf
# and leaves the rest of that file alone. Delete that line to switch all of
# this off. Same keys and programs as Perihelion Linux's Mango config;
# Super+H lists every bind. Each bind first drops whatever owned its keys.

# --- Started with the session ------------------------------------------------
exec-once = dbus-update-activation-environment --systemd WAYLAND_DISPLAY XDG_CURRENT_DESKTOP XDG_SESSION_TYPE
exec-once = perihelion-wallpaper
exec-once = perihelion-bar-start
exec-once = perihelion-shell
exec-once = appdrawer start
exec-once = /usr/lib/mate-polkit/polkit-mate-authentication-agent-1
exec-once = perihelion-nightlight
exec-once = swayidle -w timeout 600 perihelion-lock before-sleep perihelion-lock

env = QT_QPA_PLATFORMTHEME,qt6ct

# --- Keys ------------------------------------------------------------------------
unbind = SUPER, Return
bind = SUPER, Return, exec, kitty
unbind = SUPER SHIFT, Return
bind = SUPER SHIFT, Return, exec, kitty --class perihelion-float
unbind = SUPER, D
bind = SUPER, D, exec, perihelion-launcher
unbind = SUPER, A
bind = SUPER, A, exec, appdrawer
unbind = SUPER, I
bind = SUPER, I, exec, perihelion-shell glance toggle
unbind = ALT, W
bind = ALT, W, exec, perihelion-shell overview toggle
unbind = SUPER SHIFT, W
bind = SUPER SHIFT, W, exec, perihelion-wallpaper-picker
unbind = SUPER, E
bind = SUPER, E, exec, strata
unbind = SUPER, B
bind = SUPER, B, exec, firefox
unbind = SUPER, H
bind = SUPER, H, exec, perihelion-keys
unbind = SUPER, L
bind = SUPER, L, exec, perihelion-lock
unbind = SUPER SHIFT, Q
bind = SUPER SHIFT, Q, exec, perihelion-power-menu
unbind = SUPER SHIFT, D
bind = SUPER SHIFT, D, exec, perihelion-bar-start
unbind = SUPER SHIFT, E
bind = SUPER SHIFT, E, exit,

unbind = SUPER, Q
bind = SUPER, Q, killactive,
unbind = SUPER, W
bind = SUPER, W, togglefloating,
unbind = SUPER, F
bind = SUPER, F, fullscreen,
unbind = ALT, Tab
bind = ALT, Tab, cyclenext,

unbind = SUPER, left
bind = SUPER, left, movefocus, l
unbind = SUPER, right
bind = SUPER, right, movefocus, r
unbind = SUPER, up
bind = SUPER, up, movefocus, u
unbind = SUPER, down
bind = SUPER, down, movefocus, d
unbind = SUPER SHIFT CTRL, left
bind = SUPER SHIFT CTRL, left, movewindow, l
unbind = SUPER SHIFT CTRL, right
bind = SUPER SHIFT CTRL, right, movewindow, r
unbind = SUPER SHIFT CTRL, up
bind = SUPER SHIFT CTRL, up, movewindow, u
unbind = SUPER SHIFT CTRL, down
bind = SUPER SHIFT CTRL, down, movewindow, d
unbind = SUPER SHIFT, right
binde = SUPER SHIFT, right, resizeactive, 30 0
unbind = SUPER SHIFT, left
binde = SUPER SHIFT, left, resizeactive, -30 0
unbind = SUPER SHIFT, up
binde = SUPER SHIFT, up, resizeactive, 0 -30
unbind = SUPER SHIFT, down
binde = SUPER SHIFT, down, resizeactive, 0 30

unbind = SUPER SHIFT, S
bind = SUPER SHIFT, S, exec, perihelion-screenshot region
unbind = SUPER, Print
bind = SUPER, Print, exec, perihelion-screenshot region
unbind = , Print
bind = , Print, exec, perihelion-screenshot full

unbind = SUPER, 1
bind = SUPER, 1, workspace, 1
unbind = SUPER, 2
bind = SUPER, 2, workspace, 2
unbind = SUPER, 3
bind = SUPER, 3, workspace, 3
unbind = SUPER, 4
bind = SUPER, 4, workspace, 4
unbind = SUPER, 5
bind = SUPER, 5, workspace, 5
unbind = SUPER, 6
bind = SUPER, 6, workspace, 6
unbind = SUPER, 7
bind = SUPER, 7, workspace, 7
unbind = SUPER, 8
bind = SUPER, 8, workspace, 8
unbind = SUPER, 9
bind = SUPER, 9, workspace, 9
unbind = SUPER SHIFT, 1
bind = SUPER SHIFT, 1, movetoworkspace, 1
unbind = SUPER SHIFT, 2
bind = SUPER SHIFT, 2, movetoworkspace, 2
unbind = SUPER SHIFT, 3
bind = SUPER SHIFT, 3, movetoworkspace, 3
unbind = SUPER SHIFT, 4
bind = SUPER SHIFT, 4, movetoworkspace, 4
unbind = SUPER SHIFT, 5
bind = SUPER SHIFT, 5, movetoworkspace, 5
unbind = SUPER SHIFT, 6
bind = SUPER SHIFT, 6, movetoworkspace, 6
unbind = SUPER SHIFT, 7
bind = SUPER SHIFT, 7, movetoworkspace, 7
unbind = SUPER SHIFT, 8
bind = SUPER SHIFT, 8, movetoworkspace, 8
unbind = SUPER SHIFT, 9
bind = SUPER SHIFT, 9, movetoworkspace, 9
unbind = SUPER CTRL, right
bind = SUPER CTRL, right, workspace, r+1
unbind = SUPER CTRL, left
bind = SUPER CTRL, left, workspace, r-1
unbind = SUPER, mouse_down
bind = SUPER, mouse_down, workspace, e+1
unbind = SUPER, mouse_up
bind = SUPER, mouse_up, workspace, e-1
unbind = SUPER, mouse:272
bindm = SUPER, mouse:272, movewindow
unbind = SUPER, mouse:273
bindm = SUPER, mouse:273, resizewindow

unbind = , XF86AudioPlay
bindl = , XF86AudioPlay, exec, playerctl play-pause
unbind = , XF86AudioNext
bindl = , XF86AudioNext, exec, playerctl next
unbind = , XF86AudioPrev
bindl = , XF86AudioPrev, exec, playerctl previous
unbind = , XF86AudioRaiseVolume
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume -l 1.5 @DEFAULT_AUDIO_SINK@ 5%+
unbind = , XF86AudioLowerVolume
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
unbind = , XF86AudioMute
bindl = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
unbind = , XF86MonBrightnessUp
bindel = , XF86MonBrightnessUp, exec, brightnessctl set +5%
unbind = , XF86MonBrightnessDown
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
