# Perihelion Mango config: Look: gaps, borders, opacity, blur, shadows and animations. Colors are
# 0xRRGGBBAA; the border colors are overridden by ../colors.conf, which
# perihelion-theme writes from the wallpaper.

# Gaps: 2 px between windows, 4 px to the screen edges (as in Veyl OS)
gap_inner_horizontal=2
gap_inner_vertical=2
gap_outer_horizontal=4
gap_outer_vertical=4

# Borders: 2 px, Catppuccin Macchiato blue (#8aadf4) on the focused window
border_px=2
focus_color=0x8aadf4ff
border_color=0x494d64ff
urgent_color=0xed8796ff
maximized_screen_color=0x8aadf4ff
drop_color=0x8aadf455
split_color=0xc6a0f6ff
root_color=0x24273aff

# Animations, matched to Veyl OS's Hyprland: windows slide in, slide out
# while fading to nothing, and glide when moved (Hyprland's winIn, winOut
# and wind curves; Mango takes no negative values, so winOut loses its small
# pull-back). A plain fade on close: animation_type_close=fade
animations=1
layer_animations=1
animation_type_open=slide
animation_type_close=slide
animation_fade_in=1
animation_fade_out=1
fade_in_begin_opacity=0.0
fade_out_begin_opacity=1.0
animation_duration_open=500
animation_duration_close=450
animation_duration_move=450
animation_duration_tag=400
animation_curve_open=0.1,1.1,0.1,1.1
animation_curve_close=0.3,0,0,1
animation_curve_move=0.05,0.9,0.1,1.05
animation_curve_tag=0.05,0.9,0.1,1.05
animation_curve_opacity_fade_in=0.25,0.1,0.25,1
animation_curve_opacity_fade_out=0.25,0.1,0.25,1

# Rounded corners, slightly see-through unfocused windows. 12 px matches the
# corners Perihelion's GTK glass draws (perihelion-theme), so the frost
# behind a window ends exactly where the window does: no frosted wedges
# peeking out at the corners.
border_radius=12
focused_opacity=1.0
unfocused_opacity=0.90

# Blur behind see-through windows (kitty is 80% opaque by default), so the
# wallpaper shows through softly. Turn off with blur=0 on slow hardware.
blur=1
# Glass bar, dock and notifications: the (cached, cheap with blur_optimized)
# blurred wallpaper shows through their see-through parts only. Mango never
# blurs the bottom/background layers (wallpaper, desktop widgets).
blur_layer=1
blur_optimized=1
# Frosted glass, tuned for Mango's dual-Kawase blur:
# a small sampling offset over four passes gives a soft, even frost with no
# smearing or warping (a big offset over few passes, the old 7 x 2, ghosts
# and streaks). Slightly darker and more contrasty than the wallpaper (reference:
# brightness 0.85, contrast 1.23), so light text sits on the glass cleanly
# and the frost doesn't go grey and milky (contrast below 1 did that), with
# extra saturation for vibrancy. A hint of noise only dithers away the
# banding a smooth blur shows in skies and gradients; more reads as grime.
# With blur_optimized the wallpaper is blurred once and cached, so the four
# passes cost nothing per frame (like Hyprland's xray).
blur_params_radius=4
blur_params_num_passes=4
blur_params_noise=0.01
blur_params_brightness=0.88
blur_params_contrast=1.15
blur_params_saturation=1.25

# A faint, wide shadow under floating windows only: depth without the heavy
# dark halo that makes glass look dirty at its edges.
shadows=1
shadow_only_floating=1
shadows_size=8
shadows_blur=24
shadows_color=0x00000040
cursor_theme=Bibata-Modern-Classic
cursor_size=24
