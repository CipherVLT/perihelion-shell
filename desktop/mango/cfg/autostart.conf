# Perihelion Mango config: Programs started with the session (exec_once) and on every reload (exec).

# The whole Perihelion desktop, each piece once (log:
# ~/.config/perihelionbar-config/logs/perihelion-session-start/trace.log):
#   dbus activation environment (portals), notifications (mako),
#   password prompts (polkit agent), wallpaper (swaybg), Perihelion Bar on
#   top and its dock at the bottom (perihelion-bar-start), desktop widgets
#   and window overview (perihelion-shell), the app drawer daemon (Super+A),
#   the idle lock (10 minutes, and before suspend) and the night light.
# Running it again starts only what isn't running.
exec_once=perihelion-session-start

# Add your own programs below, one exec_once line each.
